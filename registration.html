<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple, responsive registration form example.">
  <title>Create an account</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="registration-card" aria-labelledby="page-title">
      <a class="brand" href="#" aria-label="DevopsExt home">DevopsExt</a>
      <p class="eyebrow">GET STARTED</p>
      <h1 id="page-title">Create your account</h1>
      <p class="intro">Enter your details below to join us.</p>

      <form action="#" method="post">
        <div class="field">
          <label for="full-name">Full name</label>
          <input id="full-name" name="fullName" type="text" autocomplete="name" placeholder="Alex Morgan" required>
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="alex@example.com" required>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
          <small>Use at least 8 characters.</small>
        </div>

        <label class="terms">
          <input name="terms" type="checkbox" required>
          <span>I agree to the <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a>.</span>
        </label>

        <button type="submit">Create account</button>
      </form>

      <p class="sign-in">Already have an account? <a href="#sign-in">Sign in</a></p>
      <p class="demo-note">Demo only: connect this form to a secure backend to register users.</p>
    </section>
  </main>
</body>
</html>
